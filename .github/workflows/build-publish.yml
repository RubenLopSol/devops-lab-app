name: Build and Publish App Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: devops-lab-app

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: vars
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${OWNER_LC}/${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.vars.outputs.image_name }}:main-${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.vars.outputs.image_name }}:latest \
            .

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.vars.outputs.image_name }}:main-${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.vars.outputs.image_name }}:latest

      - name: Notify platform repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_REPO_PAT }}
          repository: RubenLopSol/devops-lab-platform
          event-type: app-image-published
          client-payload: |
            {
              "sha": "${{ steps.vars.outputs.short_sha }}",
              "image": "${{ steps.vars.outputs.image_name }}",
              "tag": "main-${{ steps.vars.outputs.short_sha }}"
            }
